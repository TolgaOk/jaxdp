[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxdp"
authors = [
    {name = "Tolga Ok", email = "T.Ok@tudelft.nl"},
]
version = "0.4.0"
requires-python = ">=3.11"
readme = "README.md"
description = "Exact dynamic programming for finite Markov decision processes in JAX"
license = "MIT"
license-files = ["LICENCE.txt"]
keywords = ["dynamic programming", "jax", "markov decision process", "reinforcement learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chex>=0.1.90",
    "jax>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "flax>=0.10.7",
    "pytest>=8.4",
    "rich>=14.1.0",
    "ruff>=0.12.5",
    "twine>=6.1.0",
    "ty>=0.0.70",
    "tyro>=1.0.6",
]

[project.urls]
Repository = "https://github.com/TolgaOk/jaxdp"

[tool.setuptools.packages.find]
include = ["jaxdp", "jaxdp.*"]
exclude = ["jaxdp._learning*", "jaxdp._planning*", "jaxdp.mdp.sampler*"]

[tool.setuptools.package-data]
jaxdp = ["README.md"]

[tool.ty.src]
exclude = ["_doc", "_examples"]

[tool.ruff]
# Set line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "*.egg-info",
    "_doc",
    "_examples",
]

# Target Python 3.11+
target-version = "py311"

[tool.ruff.lint]
# Enable specific rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["jaxdp"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"
