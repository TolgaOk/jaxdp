name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run --no-sync ruff check jaxdp test
      - run: uv run --no-sync ruff format --check jaxdp test
      - run: uv run --no-sync ty check
      - run: uv build
      - run: uv run --no-sync twine check dist/*

  test:
    name: Python ${{ matrix.python }} / JAX ${{ matrix.jax }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            jax: "==0.8.0"
          - python: "3.11"
            jax: ">=0.8.0"
          - python: "3.12"
            jax: ">=0.8.0"
          - python: "3.13"
            jax: ">=0.8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install --editable . "pytest>=8.4" "jax${{ matrix.jax }}"
      - run: uv run --no-sync pytest
